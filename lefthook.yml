commit-msg:
  piped: true
  commands:
    commitlint:
      run: bun commitlint -e -s
pre-commit:
  piped: true
  commands:
    fix:
      run: bun fix && git update-index -g
pre-push:
  parallel: true
  commands:
    orphans:
      run: bun orphans
    env:
      run: |
        test -f .env.local || { echo "❌ ERROR: .env.local missing"; exit 1; }
